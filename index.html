<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitrine de Produtos - TechFront</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Vitrine Virtual TechFront</h1>
  </header>

  <main class="container">
    <!-- Area das mensagens e contador -->
    <div class="painel-info">
      <p id="texto-contador">Cliques em produtos: <strong>0</strong></p>
      <p id="mensagem-status">Passe o mouse ou clique em um produto!</p>
    </div>

    <!-- Onde os produtos vão aparecer pelo JS -->
    <div id="vitrine-produtos" class="vitrine"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
